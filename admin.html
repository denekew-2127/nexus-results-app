<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus Academy – Admin</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mu:#667085;--pr:#1d4ed8;--bad:#d93025;--bd:#e3e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#172033;--tx:#e8edf7;--mu:#98a2b3;--pr:#6ea0ff;--bd:#27334b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Ethiopic","Nyala",system-ui,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0)}
header{background:var(--pr);color:#fff;padding:16px;text-align:center}header h1{margin:0;font-size:20px}
main{max-width:760px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px}label{font-size:12px;color:var(--mu);display:block;margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;font-weight:600;margin-top:10px}
button.r{background:var(--bad);margin:0;padding:4px 8px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
.m{font-size:14px;margin-top:8px;color:var(--bad)}.ok{color:#0f9d58}.hide{display:none}
</style></head><body>
<header><h1>Nexus Academy</h1><div>የአስተዳዳሪ ገጽ</div></header>
<main>
<div id="lg" class="card"><h2>የአስተዳዳሪ መግቢያ</h2>
<label>ኢሜይል</label><input id="em" type="email" autocomplete="username">
<label>የይለፍ ቃል</label><input id="pw" type="password" autocomplete="current-password">
<button onclick="login()">ግባ</button><div id="lm" class="m"></div></div>

<div id="ap" class="hide">
<div class="card"><h2>ቅርንጫፎች</h2><div class="tw"><table id="bt"></table></div>
<label>የቅርንጫፍ ስም</label><input id="bn"><button onclick="addBranch()">ቅርንጫፍ ጨምር</button><div id="bm" class="m"></div></div>

<div class="card"><h2>መምህር ወይም ዳይሬክተር መመዝገብ</h2>
<div class="g"><div><label>ሙሉ ስም</label><input id="sn"></div><div><label>ኢሜይል</label><input id="se" type="email"></div>
<div><label>ጊዜያዊ የይለፍ ቃል (6+)</label><input id="sp"></div>
<div><label>ሚና</label><select id="sr"><option value="teacher">መምህር</option><option value="director">ዳይሬክተር</option><option value="admin">አስተዳዳሪ</option></select></div></div>
<label>ቅርንጫፎች (ብዙ ለመምረጥ ተጭነው ይያዙ)</label><select id="sb" multiple size="5"></select>
<button onclick="addStaff()">መዝግብ</button><div id="sm" class="m"></div>
<div class="tw"><table id="ut"></table></div></div>

<div class="card"><h2>የመምህር ምደባ (ቅርንጫፍ · ክፍል · ትምህርት)</h2>
<div class="g"><div><label>መምህር</label><select id="at"></select></div><div><label>ቅርንጫፍ</label><select id="ab"></select></div>
<div><label>ክፍል (ልክ እንደ ተማሪው ክፍል)</label><input id="ag" value="Grade 8"></div><div><label>ትምህርት</label><select id="as"></select></div></div>
<button onclick="addAssign()">ምደባ ጨምር</button><div id="am" class="m"></div>
<div class="tw"><table id="atb"></table></div></div>

<div class="card"><h2>ተማሪ መመዝገብ</h2>
<div class="g"><div style="grid-column:1/3"><label>ሙሉ ስም</label><input id="tn"></div>
<div><label>የምዝገባ ቁጥር</label><input id="ti" inputmode="numeric"></div>
<div><label>ጾታ</label><select id="tg"><option>Male</option><option>Female</option></select></div>
<div><label>ክፍል (Grade)</label><input id="tc" value="Grade 8"></div>
<div><label>ቅርንጫፍ</label><select id="tb"></select></div></div>
<button onclick="addStudent()">ተማሪ መዝግብ</button><div id="tm" class="m"></div>
<label>ዝርዝር ለማየት ቅርንጫፍ</label><select id="fb" onchange="listStudents()"></select>
<div class="tw"><table id="st"></table></div></div>
<button onclick="out()">ውጣ</button>
</div></main>
<footer style="text-align:center;color:var(--mu);font-size:12px;padding:16px">Developed by Denekew Bamlaku · DB technologies</footer>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,collection,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// Use the same two values you put in index.html
const CFG={apiKey:"PASTE_API_KEY",authDomain:"nexus-academy-b4efc.firebaseapp.com",projectId:"nexus-academy-b4efc",appId:"PASTE_APP_ID"};
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let B=[],U=[],SB=[];const DEF=[["en","English"],["ci","Citizenship"],["ma","Mathematics"],["ss","Social Studies"],["gs","General Science"],["am","Amharic as Mother Tongue"]];
const say=(id,t,ok)=>{$(id).textContent=t;$(id).className="m"+(ok?" ok":"")};
window.login=async()=>{say("lm","");
 try{const c=await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);
  const u=await getDoc(doc(db,"users",c.user.uid));
  if(!u.exists()||u.data().role!=="admin"){await signOut(auth);say("lm","ይህ መለያ የአስተዳዳሪ ፈቃድ የለውም።");return}
  $("lg").classList.add("hide");$("ap").classList.remove("hide");await refresh()}
 catch(e){say("lm","መግባት አልተሳካም: "+(e.code||e.message))}};
window.out=()=>{signOut(auth);location.reload()};
async function refresh(){
 B=(await getDocs(collection(db,"branches"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
 const opts=B.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("");
 $("sb").innerHTML=opts;$("tb").innerHTML=opts;$("fb").innerHTML=opts;
 $("bt").innerHTML=B.length?B.map(b=>`<tr><td>${esc(b.name)}</td><td><button class="r" data-b="${esc(b.id)}">ሰርዝ</button></td></tr>`).join(""):"<tr><td>ገና ቅርንጫፍ የለም። ከታች ጨምር።</td></tr>";
 const us=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()}));
 $("ut").innerHTML="<tr><th>ስም</th><th>ሚና</th><th>ቅርንጫፍ</th></tr>"+us.map(u=>`<tr><td>${esc(u.name||u.email)}</td><td>${esc(u.role)}</td><td>${esc((u.branches||[]).map(i=>(B.find(b=>b.id===i)||{}).name||i).join(", "))}</td></tr>`).join("");
U=us;const T=us.filter(u=>u.role==="teacher");
 const cf=await getDoc(doc(db,"config","subjects"));SB=cf.exists()?cf.data().sub.map(o=>[o.k,o.n]):DEF;
 $("at").innerHTML=T.map(u=>`<option value="${esc(u.id)}">${esc(u.name||u.email)}</option>`).join("");
 $("ab").innerHTML=opts;$("as").innerHTML=SB.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join("");
 $("atb").innerHTML="<tr><th>መምህር</th><th>ቅርንጫፍ</th><th>ክፍል</th><th>ትምህርት</th><th></th></tr>"+T.flatMap(u=>(u.assign||[]).map((a,i)=>`<tr><td>${esc(u.name||u.email)}</td><td>${esc((B.find(b=>b.id===a.b)||{}).name||a.b)}</td><td>${esc(a.gr)}</td><td>${esc((SB.find(x=>x[0]===a.s)||[])[1]||a.s)}</td><td><button class="r" data-u="${esc(u.id)}" data-i="${i}">ሰርዝ</button></td></tr>`)).join("");
 try{await setDoc(doc(db,"config","teachers"),{list:T.map(u=>({id:u.id,n:u.name||u.email,a:u.assign||[]}))})}catch(e){}
 listStudents()}
// Flat lists (grades/subs/mk) are what firestore.rules checks; assign is for display.
async function saveAssign(id,A){const subs=[...new Set(A.map(x=>x.s))];
 await updateDoc(doc(db,"users",id),{assign:A,grades:[...new Set(A.map(x=>x.gr))],subs,mk:subs.flatMap(s=>[s+"_1",s+"_2"])});await refresh()}
window.addAssign=async()=>{const u=U.find(x=>x.id===$("at").value),b=$("ab").value,gr=$("ag").value.trim(),s=$("as").value;
 if(!u||!b||!gr||!s){say("am","ሁሉንም ይሙሉ።");return}
 if(!(u.branches||[]).includes(b)){say("am","መምህሩ ለዚህ ቅርንጫፍ አልተመዘገበም።");return}
 const A=[...(u.assign||[])];if(A.some(x=>x.b===b&&x.gr===gr&&x.s===s)){say("am","ቀድሞ ተመድቧል።");return}
 A.push({b,gr,s});try{await saveAssign(u.id,A);say("am","✓ ተመድቧል",1)}catch(e){say("am","አልተሳካም: "+(e.code||e.message))}};
$("atb").onclick=async e=>{const id=e.target.dataset.u;if(!id||!confirm("ምደባው ይሰረዝ?"))return;
 const u=U.find(x=>x.id===id);await saveAssign(id,(u.assign||[]).filter((_,i)=>i!==+e.target.dataset.i))};
$("bt").onclick=async e=>{const i=e.target.dataset.b;if(i&&confirm("ቅርንጫፉ ይሰረዝ?")){await deleteDoc(doc(db,"branches",i));refresh()}};
window.addBranch=async()=>{const n=$("bn").value.trim();if(!n){say("bm","የቅርንጫፍ ስም ያስገቡ።");return}
 if(B.some(b=>b.name.toLowerCase()===n.toLowerCase())){say("bm","ይህ ቅርንጫፍ ቀድሞ አለ።");return}
 await setDoc(doc(db,"branches","b"+Date.now().toString(36)),{name:n});$("bn").value="";say("bm","✓ ቅርንጫፍ ተጨመረ",1);refresh()};
window.addStaff=async()=>{const name=$("sn").value.trim(),email=$("se").value.trim(),pw=$("sp").value,role=$("sr").value,br=[...$("sb").selectedOptions].map(o=>o.value);
 if(!name||!email||pw.length<6){say("sm","ስም፣ ኢሜይል እና 6+ ፊደል የይለፍ ቃል ያስፈልጋል።");return}
 if(role!=="admin"&&!br.length){say("sm","ቢያንስ አንድ ቅርንጫፍ ይምረጡ።");return}
 const sec=initializeApp(CFG,"sec");
 try{const c=await createUserWithEmailAndPassword(getAuth(sec),email,pw);
  await setDoc(doc(db,"users",c.user.uid),{name,email,role,branches:br});
  ["sn","se","sp"].forEach(i=>$(i).value="");say("sm","✓ ተመዝግቧል። የይለፍ ቃሉን ለሰውየው ይስጡ።",1);refresh()}
 catch(e){say("sm","አልተሳካም: "+(e.code||e.message))}finally{await deleteApp(sec)}};
window.addStudent=async()=>{const name=$("tn").value.trim().toUpperCase(),id=$("ti").value.trim(),br=$("tb").value;
 if(!name||!id||!br){say("tm","ስም፣ ቁጥር እና ቅርንጫፍ ያስፈልጋል።");return}
 const pin=String(Math.floor(1000+Math.random()*9000)),key=id+"-"+pin;
 await setDoc(doc(db,"students",key),{id,name,g:$("tg").value,gr:$("tc").value.trim(),y:"2018",z:"Gurage",w:"WOLKITE",branch:br,pin,a:{}});
 ["tn","ti"].forEach(i=>$(i).value="");say("tm","✓ ተመዝግቧል። ተማሪው ውጤት ለማየት የሚያስገባው: "+key,1);listStudents()};
window.listStudents=async()=>{const b=$("fb").value;if(!b){$("st").innerHTML="";return}
 const L=(await getDocs(query(collection(db,"students"),where("branch","==",b)))).docs.map(d=>({k:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
 $("st").innerHTML="<tr><th>#</th><th>ስም</th><th>ክፍል</th><th>የተማሪ ቁልፍ</th></tr>"+L.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.gr)}</td><td>${esc(s.k)}</td></tr>`).join("")};
</script></body></html>
